<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <div class="contact-form">

        <h1>Contact Form</h1>
        <h4>Please fill all the texts in the fields.</h4>

        <hr>

        <form>

            <div class="row">
                <label>Your Name :</label>
                <input type="text" placeholder="Your Full Name" required>
            </div>

            <div class="row">
                <label>Your Email :</label>
                <input type="email" placeholder="Valid Email Address" required>
            </div>

            <div class="row">
                <label>Message :</label>
                <textarea placeholder="Your Message to Us" required></textarea>
            </div>

            <div class="row">
                <label>Subject :</label>

                <select>
                    <option>Job Inquiry</option>
                    <option>General Question</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="row">
                <label></label>
                <input type="submit" value="Send">
            </div>

        </form>

    </div>

</body>
</html>
